<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        <div class="balance-container">
            <h2> Your Balance </h2>
            <h1 id="balance">$0.00</h1>

            <div class="summary">
                <div class="income">
                    <h3>Income</h3>
                    <br>
                    <p id="income-amount">$0.00</p>
                </div>
                <div class="expenses">
                    <h3>Expenses</h3>
                    <br>
                    <p id="expense-amount">$0.00</p>
                </div> 
            </div>
        </div>
        <div class="main-content">
            <div class="transaction-container">
                <h3>Transactions</h3>
                <ul id="transaction-list">
                    <!--Transactions will be inserted by JS-->
                </ul>
            </div>

            <div class="form-container">
                <h3>Add Transaction</h3>
                <br>
                <form id="transaction-form">
                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder=
                        "Enter Description.." required> 
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" placeholder=
                        "Enter Amount.." required> 
                    </div>
                    <small>Use negative (-) for expenses</small>
                    <br>
                    <button type="submit">Add Transaction</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
